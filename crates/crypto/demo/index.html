<!doctype html>
<meta charset="utf-8">
<title>Bastion encryption demo</title>
<style>
  body { font: 15px system-ui, sans-serif; max-width: 44rem; margin: 2rem auto; padding: 0 1rem; }
  pre { background: #f3f3f3; padding: .75rem; overflow: auto; white-space: pre-wrap; }
  input { width: 60%; padding: .3rem; } button { padding: .3rem .8rem; }
</style>
<h1>Bastion encryption demo</h1>
<p>Alice and Bob both run in this page. Alice makes a group, adds Bob and sends him a
message. Only ciphertext passes between them, and nothing leaves your browser.</p>
<p><input id="msg" value="hello from alice"> <button id="go" disabled>Send</button></p>
<pre id="out">loading...</pre>
<script type="module">
  import init, { WasmClient, safetyCode } from "./pkg/bastion_crypto.js";
  const enc = new TextEncoder(), dec = new TextDecoder();
  const hex = (b) => [...b.slice(0, 24)].map((x) => x.toString(16).padStart(2, "0")).join("") + "...";
  const out = document.getElementById("out");
  const log = (s) => (out.textContent += s + "\n");

  await init();
  const go = document.getElementById("go");
  go.disabled = false;
  out.textContent = "ready\n";

  go.onclick = () => {
    out.textContent = "";
    try {
      const alice = new WasmClient(enc.encode("alice/1"));
      const bob = new WasmClient(enc.encode("bob/1"));
      const gid = crypto.getRandomValues(new Uint8Array(16));

      alice.createGroup(gid);
      const added = alice.addMember(gid, bob.keyPackage());
      alice.commitAccepted(gid);
      bob.join(added.welcome);
      log(`group ${hex(gid)} at epoch ${alice.epoch(gid)}`);

      const plain = enc.encode(document.getElementById("msg").value);
      const cipher = alice.encrypt(gid, plain);
      log(`plaintext ${plain.length} bytes -> ciphertext ${cipher.length} bytes (padded)`);
      log(`ciphertext ${hex(cipher)}`);

      const got = bob.receive(gid, cipher);
      log(`bob read: "${dec.decode(got.content)}" from ${dec.decode(got.sender)}`);
      log(`safety code:\n${safetyCode(enc.encode("alice"), alice.identityKey(), enc.encode("bob"), bob.identityKey())}`);
    } catch (e) {
      log("error: " + e.message);
    }
  };
</script>
