[package]
name = "bastion-crypto"
version = "0.0.0"
description = "Bastion end-to-end encryption core (MLS via OpenMLS), compiled to WASM for clients."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
openmls = "0.9.2"
openmls_basic_credential = "0.6"
openmls_rust_crypto = "0.6"
sha2 = "0.11.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
getrandom = { version = "0.4", features = ["wasm_js"] }
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
openmls = { version = "0.9.2", features = ["js"] }
