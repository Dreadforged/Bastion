name: Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    # Production is gated by required reviewers on the GitHub environment.
    environment: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # Migrations run before the new code so the schema is ready for it. D1 skips ones already
      # applied, and a failure stops the deploy. Migrations must stay backward compatible with the
      # code that is still live (add columns and tables, do not drop or rename in the same release).
      - name: apply D1 migrations
        working-directory: workers/api
        run: npx wrangler d1 migrations apply DB --remote --env ${{ inputs.environment || 'staging' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: wrangler deploy
        working-directory: workers/api
        run: npx wrangler deploy --env ${{ inputs.environment || 'staging' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Web app on Cloudflare Pages. Set these on each GitHub environment (variables, not secrets):
      #   WEB_PAGES_PROJECT   Pages project name, e.g. the staging and production projects
      #   WEB_API_ORIGIN, WEB_FILES_ORIGIN, WEB_LIVEKIT_URL   feed the CSP (see apps/web/scripts/headers.mjs)
      #   VITE_API_URL        API address baked into the build; unset means "/api"
      # Until WEB_PAGES_PROJECT is set this step is skipped.
      - name: build web
        if: ${{ vars.WEB_PAGES_PROJECT != '' }}
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-pack --locked
          npm run build:wasm -w @bastion/web
          npm run build -w @bastion/web
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          WEB_API_ORIGIN: ${{ vars.WEB_API_ORIGIN }}
          WEB_FILES_ORIGIN: ${{ vars.WEB_FILES_ORIGIN }}
          WEB_LIVEKIT_URL: ${{ vars.WEB_LIVEKIT_URL }}
      - name: deploy web
        if: ${{ vars.WEB_PAGES_PROJECT != '' }}
        working-directory: apps/web
        run: npx wrangler pages deploy dist --project-name "${{ vars.WEB_PAGES_PROJECT }}" --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
