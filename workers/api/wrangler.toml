name = "bastion-api"
main = "src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

# Bindings are not inherited by [env.*] blocks, so each environment repeats them.
# Replace the placeholder database ids after running `wrangler d1 create`.

# ---------------------------------------------------------------- local dev
[vars]
ENVIRONMENT = "development"
RP_ID = "localhost"
RP_NAME = "Bastion (dev)"
APP_ORIGIN = "http://localhost:5173"

[[durable_objects.bindings]]
name = "USER_SESSION"
class_name = "UserSession"

[[durable_objects.bindings]]
name = "SERVER"
class_name = "Server"

[[durable_objects.bindings]]
name = "CONVERSATION"
class_name = "Conversation"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserSession", "Server", "Conversation"]

[[d1_databases]]
binding = "DB"
database_name = "bastion-dev"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "FILES"
bucket_name = "bastion-files-dev"

# Per-IP limit for unauthenticated /auth endpoints. IPs are only used as a
# key here and are never stored.
[[ratelimits]]
name = "AUTH_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Per-user limit for server, message and invite routes, keyed by user id.
[[ratelimits]]
name = "API_RATE_LIMIT"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

# Hourly cleanup of expired enrollments, challenges, sessions and invite codes.
[triggers]
crons = ["0 * * * *"]

# ---------------------------------------------------------------- staging
[env.staging]
name = "bastion-api-staging"

[env.staging.vars]
