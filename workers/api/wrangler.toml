name = "bastion-api"
main = "src/index.ts"
compatibility_date = "2025-11-01"
compatibility_flags = ["nodejs_compat"]

# Bindings are not inherited by [env.*] blocks, so each environment repeats them.
# Replace the placeholder database ids after running `wrangler d1 create`. The all-zero ids are
# PLACEHOLDERS, not real resources; the deploy workflow's migration step fails until they are replaced.

# ---------------------------------------------------------------- local dev
# Voice and files are off until these are set (see docs/ops):
#   vars:    LIVEKIT_URL, FILES_ORIGIN, R2_ACCOUNT_ID, R2_BUCKET_NAME
#   secrets: LIVEKIT_API_KEY, LIVEKIT_API_SECRET, FILE_URL_SECRET,
#            R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY   (wrangler secret put)
[vars]
ENVIRONMENT = "development"
RP_ID = "localhost"
RP_NAME = "Bastion (dev)"
APP_ORIGIN = "http://localhost:5173"
# Turns on the /dev sign-in and seed routes (see docs/local-testing.md). Local only: it must never
# appear in an [env.*] block, and test/dev-gate.test.ts fails if it does.
DEV_SEED = "local"
# Staff admin tool (/staff), behind Cloudflare Access. Leave unset and the routes answer 404.
# STAFF_ACCESS_TEAM_DOMAIN = "yourteam.cloudflareaccess.com"
# STAFF_ACCESS_AUDIENCE = "<the Access application AUD tag>"
# STAFF_EMAILS = "a@example.com,b@example.com"   # optional second check

# Compiled into the bundle. True here, false in staging and production, so the dev code is removed there.
[define]
__BASTION_LOCAL_DEV__ = "true"

[[durable_objects.bindings]]
name = "USER_SESSION"
class_name = "UserSession"

[[durable_objects.bindings]]
name = "SERVER"
class_name = "Server"

[[durable_objects.bindings]]
name = "CONVERSATION"
class_name = "Conversation"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UserSession", "Server", "Conversation"]

[[d1_databases]]
binding = "DB"
database_name = "bastion-dev"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "FILES"
bucket_name = "bastion-files-dev"

# Per-IP limit for unauthenticated /auth endpoints. IPs are only used as a
# key here and are never stored.
[[ratelimits]]
name = "AUTH_RATE_LIMIT"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Per-user limit for server, message and invite routes, keyed by user id.
[[ratelimits]]
name = "API_RATE_LIMIT"
namespace_id = "1002"
simple = { limit = 120, period = 60 }

# Hourly cleanup of expired enrollments, challenges, sessions and invite codes.
[triggers]
crons = ["0 * * * *"]

# ---------------------------------------------------------------- staging
[env.staging]
name = "bastion-api-staging"

[env.staging.vars]
ENVIRONMENT = "staging"
# TODO: set RP_ID, RP_NAME and APP_ORIGIN once the staging domain is chosen.

[env.staging.define]
__BASTION_LOCAL_DEV__ = "false"

[[env.staging.durable_objects.bindings]]
name = "USER_SESSION"
class_name = "UserSession"

[[env.staging.durable_objects.bindings]]
name = "SERVER"
class_name = "Server"

[[env.staging.durable_objects.bindings]]
name = "CONVERSATION"
class_name = "Conversation"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "bastion-staging"
database_id = "00000000-0000-0000-0000-000000000000"

[[env.staging.r2_buckets]]
binding = "FILES"
bucket_name = "bastion-files-staging"

# Per-IP limit for unauthenticated /auth endpoints. IPs are only used as a
# key here and are never stored.
[[env.staging.ratelimits]]
name = "AUTH_RATE_LIMIT"
namespace_id = "2001"
simple = { limit = 30, period = 60 }

# Per-user limit for server, message and invite routes, keyed by user id.
[[env.staging.ratelimits]]
name = "API_RATE_LIMIT"
namespace_id = "2002"
simple = { limit = 120, period = 60 }

# Hourly cleanup of expired enrollments, challenges, sessions and invite codes.
[env.staging.triggers]
crons = ["0 * * * *"]

# ---------------------------------------------------------------- production
[env.production]
name = "bastion-api-production"

[env.production.vars]
ENVIRONMENT = "production"
# TODO: set RP_ID, RP_NAME and APP_ORIGIN once the production domain is chosen.

[env.production.define]
__BASTION_LOCAL_DEV__ = "false"

[[env.production.durable_objects.bindings]]
name = "USER_SESSION"
class_name = "UserSession"

[[env.production.durable_objects.bindings]]
name = "SERVER"
class_name = "Server"

[[env.production.durable_objects.bindings]]
name = "CONVERSATION"
class_name = "Conversation"

[[env.production.d1_databases]]
binding = "DB"
database_name = "bastion-production"
database_id = "00000000-0000-0000-0000-000000000000"

[[env.production.r2_buckets]]
binding = "FILES"
bucket_name = "bastion-files-production"

# Per-IP limit for unauthenticated /auth endpoints. IPs are only used as a
# key here and are never stored.
[[env.production.ratelimits]]
name = "AUTH_RATE_LIMIT"
namespace_id = "3001"
simple = { limit = 30, period = 60 }

# Per-user limit for server, message and invite routes, keyed by user id.
[[env.production.ratelimits]]
name = "API_RATE_LIMIT"
namespace_id = "3002"
simple = { limit = 120, period = 60 }

# Hourly cleanup of expired enrollments, challenges, sessions and invite codes.
[env.production.triggers]
crons = ["0 * * * *"]
